[package]
name = "hmcp-common"
edition.workspace = true
version.workspace = true

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
zeroize = { version = "1", features = ["derive"] }
