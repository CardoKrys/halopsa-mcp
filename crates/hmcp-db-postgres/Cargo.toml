[package]
name = "hmcp-db-postgres"
edition.workspace = true
version.workspace = true

[dependencies]
hmcp-common = { path = "../hmcp-common" }
aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
pgvector = { version = "0.4", features = ["sqlx"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros"] }
tokio = { version = "1", features = ["sync"] }
zeroize = { version = "1", features = ["derive"] }
