services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${HMCP_DB_USER:-hmcp}
      POSTGRES_PASSWORD: ${HMCP_DB_PASSWORD:?HMCP_DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${HMCP_DB_NAME:-hmcp}
    volumes:
      - hmcp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HMCP_DB_USER:-hmcp} -d ${HMCP_DB_NAME:-hmcp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hmcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    expose:
      - "8080"
    env_file: .env
    environment:
      HMCP_DATABASE_URL: postgres://${HMCP_DB_USER:-hmcp}:${HMCP_DB_PASSWORD:?HMCP_DB_PASSWORD must be set in .env}@postgres:5432/${HMCP_DB_NAME:-hmcp}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - hmcp-caddy-data:/data
      - hmcp-caddy-config:/config
    depends_on:
      - hmcp-server
    restart: unless-stopped

volumes:
  hmcp-postgres:
    external: true
    name: hmcp-postgres
  hmcp-caddy-data:
  hmcp-caddy-config:
