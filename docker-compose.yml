services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${HMCP_DB_USER:-hmcp}
      POSTGRES_PASSWORD: ${HMCP_DB_PASSWORD:-hmcp}
      POSTGRES_DB: ${HMCP_DB_NAME:-hmcp}
    volumes:
      - hmcp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HMCP_DB_USER:-hmcp} -d ${HMCP_DB_NAME:-hmcp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hmcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      HMCP_DATABASE_URL: postgres://${HMCP_DB_USER:-hmcp}:${HMCP_DB_PASSWORD:-hmcp}@postgres:5432/${HMCP_DB_NAME:-hmcp}
    depends_on:
      postgres:
        condition: service_healthy
      hmcp-embedder:
        condition: service_started
    restart: unless-stopped

  hmcp-embedder:
    build:
      context: .
      dockerfile: Dockerfile
      target: embedder
    env_file: .env
    environment:
      HMCP_DATABASE_URL: postgres://${HMCP_DB_USER:-hmcp}:${HMCP_DB_PASSWORD:-hmcp}@postgres:5432/${HMCP_DB_NAME:-hmcp}
      HMCP_EMBED_CACHE_DIR: /models
    volumes:
      - hmcp-models:/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hmcp-postgres:
    external: true
    name: hmcp-postgres
  hmcp-models:
    external: true
    name: hmcp-models
